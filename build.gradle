}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

static def nativePlatform() {
    def os = System.getProperty("os.name").toLowerCase()
    def arch = System.getProperty("os.arch").toLowerCase()

    if (os.contains("windows")) {
        if (arch.contains("amd64") || arch.contains("x86_64")) {
            return "windows_64"
        }
    } else if (os.contains("linux")) {
        if (arch.contains("amd64") || arch.contains("x86_64")) {
            return "linux_64"
        }
    } else if (os.contains("mac")) {
        if (arch.contains("aarch64") || arch.contains("arm64")) {
            return "macos_arm64"
        }
        if (arch.contains("amd64") || arch.contains("x86_64")) {
            return "macos_64"
        }
    }

    throw new GradleException(
            "Unsupported native platform: ${os} / ${arch}"
    )
}

def nativePlatform = nativePlatform()

tasks.register("buildNative", Exec) {
    workingDir file("native")

    commandLine "cargo", "build", "--release"
}

tasks.register("syncNative", Sync) {
    dependsOn "buildNative"

    from file("native/target/release")
    into file("src/main/native/natives/${nativePlatform}")

    include "*.dll"
    include "*.so"
    include "*.dylib"
}

sourceSets {
    earlyagent {
        java.srcDir 'src/main/earlyagent'
    }


    agent {
        java.srcDir 'src/main/agent'
    }

    service {
        java.srcDir 'src/main/service/java'
        resources.srcDir 'src/main/service/resources'
    }
}

configurations {
    kotlinRuntime

    agentImplementation.extendsFrom implementation
    agentCompileOnly.extendsFrom compileOnly
}

def earlyagentJarTask = tasks.register('earlyagentJar', Jar) {
    dependsOn tasks.named('earlyagentClasses')

    archiveClassifier.set('earlyagent')
    from sourceSets.earlyagent.output

    manifest {
        attributes(
                'Agent-Class': 'io.github.riiimc.riiilib.earlyagent.RiiiLibAgent',
                "Can-Retransform-Classes": "true"
        )
    }
}

def agentJarTask = tasks.register('agentJar', Jar) {
    dependsOn tasks.named('agentClasses')

    archiveClassifier.set('agent')
    from sourceSets.agent.output

    manifest {
        attributes(
                'Agent-Class': 'io.github.riiimc.riiilib.agent.RiiiLibAgent'
        )
    }
}

tasks.named('jar', Jar) {
    dependsOn agentJarTask

    from(agentJarTask.flatMap { it.archiveFile }) {
        into 'META-INF/riiilib'
        rename { 'agent.jar' }
    }

    from {
        configurations.kotlinRuntime.collect {
            zipTree(it)
        }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    exclude "META-INF/*.SF"
    exclude "META-INF/*.RSA"
    exclude "META-INF/*.DSA"
}



def serviceJarTask = tasks.register('serviceJar', Jar) {
    dependsOn tasks.named('serviceClasses')
    dependsOn earlyagentJarTask
    dependsOn jar

    archiveBaseName.set('riiilib-service')
    archiveClassifier.set('')
    from sourceSets.service.output

    from(earlyagentJarTask.flatMap { it.archiveFile }) {
        into 'META-INF/riiilib'
        rename { 'agent.jar' }
    }
    from(jar { it.archiveFile }) {
        into 'META-INF/riiilib'
        rename { 'mod.jar' }
    }


    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/*.DSA'

    manifest {
        attributes(
                'Automatic-Module-Name': 'io.github.riiimc.riiilib.service'
        )
    }
}

tasks.named('assemble') {
    dependsOn serviceJarTask
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    validateAccessTransformers = true
    accessTransformers {
        files("src/main/resources/META-INF/accesstransformer.cfg")
    }

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            taskBefore tasks.named("syncNative")
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            taskBefore tasks.named("syncNative")
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
    addModdingDependenciesTo sourceSets.service

}

