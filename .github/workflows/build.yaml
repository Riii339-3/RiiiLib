
name: Build Main

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  native-linux:
    uses: ./.github/workflows/native_linux.yaml

  native-mac:
    uses: ./.github/workflows/native_mac.yaml

  native-windows:
    uses: ./.github/workflows/native_win.yaml

  build:
    needs:
      - native-linux
      - native-mac
      - native-windows

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Download Linux native
        uses: actions/download-artifact@v4
        with:
          name: native-linux_64
          path: src/main/native/natives/linux_64

      - name: Download Windows native
        uses: actions/download-artifact@v4
        with:
          name: native-windows_64
          path: src/main/native/natives/windows_64

      - name: Download macOS ARM64 native
        uses: actions/download-artifact@v4
        with:
          name: native-macos_arm64
          path: src/main/native/natives/macos_arm64

      - name: Download macOS x86-64 native
        uses: actions/download-artifact@v4
        with:
          name: native-macos_64
          path: src/main/native/natives/macos_64

      - name: Build with Gradle
        run: ./gradlew build -x syncNative

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
          if-no-files-found: error